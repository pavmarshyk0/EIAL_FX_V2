name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q eialfx.py quote_backtest.py dukascopy_to_quotes.py make_catalog.py research_gate.py
      - run: python -m pytest -q
      - name: Run offline demonstrator (synthetic only)
        run: |
          python eialfx.py demo --out results/ci_demo
          python quote_backtest.py demo --out results/ci_quote_demo
          python research_gate.py --forecast results/ci_demo/report.json --quotes results/ci_quote_demo/report.json --out results/ci_gate.json
